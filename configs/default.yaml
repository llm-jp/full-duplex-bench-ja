# Full-Duplex-Bench-JA default configuration.
# Paths are placeholders; audio/corpus are NOT bundled (see DATASET.md).

corpus:
  # Root of LLM-jp-Zoom1 (obtain separately; see DATASET.md).
  zoom1_root: /path/to/llmjp-zoom1
  # Optional overrides; default to <zoom1_root>/text and /audio_merged.
  # text_dir: /path/to/llmjp-zoom1/text
  # audio_dir: /path/to/llmjp-zoom1/audio_merged
  # Where reconstructed eval clips + manifests are written (git-ignored).
  eval_dir: ./data/eval

tasks: [pause, smooth_tt]   # bc(相槌)は実験的タスク。既定では採点しない(下の detection.bc は残してある)

# Event-detection thresholds (aligned with original Full-Duplex-Bench).
detection:
  pause:     { min_gap: 0.4, max_gap: 1.0, min_a_turn_duration: 5.0 }
  smooth_tt: { min_a_duration: 4.0, max_gap: 0.4, min_b_duration: 4.0 }
  bc:        { min_a_duration: 3.0, bc_max_chars: 6, bc_max_duration: 1.5 }
  # Event boundaries: "transcript" = character timestamps (v4.0, the published
  # numbers); "audio" = the same events with boundaries moved onto the human
  # speech of the GT clip (v4.1, data/event_boundaries.py). The character
  # timestamps run ~0.15-0.3 s early against the audio on LLM-jp-Zoom1.
  boundaries: transcript
  # v4.2 (optional): keep a Smooth TT event only when A actually hands the turn
  # to B. (a) A's utterance is not backchannel-dominant, (b) B is not speaking
  # in the 2 s before a_end (characters; with boundaries: audio also B's voice
  # activity), (c) B's utterance is not a chain of backchannels
  # (data/event_detection.py: SmoothTTRoles). false = v4.0 / v4.1 event set.
  smooth_tt_roles:
    enabled: false
    a_max_resid_chars: 6     # (a) characters left after removing backchannel words
    a_min_resid_cps: 1.5     # (a) ... per second of A's utterance
    a_min_resid_ratio: 0.4   # (a) ... share of A's characters
    b_pre_window: 2.0        # (b) seconds before a_end
    b_pre_max: 0.5           # (b) max seconds of B speech in that window
    b_max_resid_chars: 2     # (c)
    b_min_resid_ratio: 0.3   # (c)
  # Model speech intervals for the binary TOR: "transcript" = character
  # timestamps of the model-output ASR (the published numbers); "audio" = voice
  # activity of the model channel of combined.wav (same detector as
  # boundaries: audio, silences <= 0.3 s joined), the ASR only for the
  # character counts (data/system_activity.py). Independent of how the ASR
  # backend places character ends; not comparable with the published numbers.
  system_activity: transcript
  system_vad: {}   # optional: merge_gap / max_offset / min_chars / VAD fields (margin_db, mode, ...)
  clips_per_task: 200
  clip_seconds: 20

models:
  - name: jmoshi
    adapter: moshi_ws
    url: ws://localhost:8998/api/chat
    domain: out          # out-of-domain w.r.t. LLM-jp-Zoom1
  - name: llmjp_moshi_v1
    adapter: moshi_ws
    url: ws://localhost:8998/api/chat
    domain: in           # in-domain: trained on LLM-jp-Zoom1 (document leakage!)
  - name: gemini
    adapter: gemini_live
    model: gemini-live-2.5-flash-preview
    domain: out
  - name: jmoshi_ext
    adapter: moshi_ws
    url: ws://localhost:8999/api/chat   # nu-dialogue/j-moshi-ext server
    domain: out
  - name: gpt_realtime
    adapter: openai_realtime            # needs OPENAI_API_KEY
    model: gpt-realtime
    voice: marin
    domain: out
  - name: grok_voice
    adapter: openai_realtime            # same protocol; needs XAI_API_KEY
    url: wss://api.x.ai/v1/realtime
    model: grok-voice-latest
    voice: eve
    domain: out
  # Degenerate references. Report these on every task: a model must beat them
  # everywhere, not only on the task whose desired behaviour they mimic.
  - name: silence_baseline
    adapter: silence
    domain: out
  - name: always_talk_baseline
    adapter: always_talk
    # Must be speech (TOR reads the ASR). Default: a 60 s Open JTalk loop (voice "Mei", CC BY 3.0)
    # synthesised on first use into ~/.cache/fdbja (needs `pip install pyopenjtalk`);
    # source_wav overrides it.
    source: auto
    domain: out

# ASR of the model responses (``fdbja transcribe``) for binary TOR.
#   reazonspeech_whisperx : ReazonSpeech-ESPnet + WhisperX alignment (default; pipeline of the
#                           published numbers, use it to compare with the leaderboard)
#   reazonspeech_nemo     : ReazonSpeech NeMo v2, token timestamps, no aligner, ~5x faster
#   reazonspeech_k2       : ReazonSpeech k2 v2 via sherpa-onnx, CPU-friendly, lightest install
# Each needs its extra: uv sync --extra asr-reazon-whisperx | asr-nemo | asr-k2
asr:
  backend: reazonspeech_whisperx
  options: {}          # constructor kwargs, e.g. {device: cuda:1} or {char_seconds: 0.1, bridge_seconds: 0.5}
  # A channel with no frame above min_rms (-80 dBFS) is not sent to the ASR (transcript = []):
  # recognisers hallucinate on digital silence. drop_unvoiced_items also drops characters whose
  # span has no voiced frame (off: the published numbers were computed without it).
  silence_gate: {min_rms: 1.0e-4, drop_unvoiced_items: false}

metrics:
  tor:
    enabled: true
  vap_distance:
    # 実験的指標 (experimental). 既定では無効。人手判断との相関などの検証が済むまで
    # 主指標は TOR とし、VAP-distance は true にした場合だけ参考値として併記する。
    enabled: false
    # Japanese VAP checkpoint (MIT): https://huggingface.co/maai-kyoto/vap_jp_kyoto
    # Removed from `main` on 2026-10-01; fetch the pinned revision used for the leaderboard:
    #   https://huggingface.co/maai-kyoto/vap_jp_kyoto/resolve/fe24ac60d8fcc80463edde97ed90e3ceca5e5b88/vap_state_dict_jp_kyoto_20hz_2500msec.pt
    #   (SHA-256 7ad0bf0b59e17a30ee55cee2aa6db89b84d64b670881ccd3f74b52ccede05d29)
    # Download into <VAP_REALTIME_ROOT>/asset/vap/.
    vap_model: vap_state_dict_jp_kyoto_20hz_2500msec.pt
    # CPC encoder shipped with VAP-Realtime (asset/cpc/).
    cpc_model: 60k_epoch4-d0f474de.pt
    frame_rate: 20
    context_len_sec: 2.5
    use_gpu: true        # falls back to CPU when CUDA is unavailable
    # exp(-alpha * D_KL); set null to auto-calibrate (median desired -> 0.5)
    alpha: null

output:
  dir: ./results
  exporters: [json]     # json | table | wandb
